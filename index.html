let currentPage = 0;
const questionsPerPage = 10;

const answers = new Array(questions.length).fill(null);

const optionLetters = ["A","B","C","D"];

/*
Shuffle questions from all 10 papers.

If you want the original Paper 1 → Paper 10 order,
change this to:
const testQuestions = [...questions];
*/

const testQuestions = [...questions].sort(() => Math.random() - 0.5);


/* =========================================================
   DISPLAY QUIZ
========================================================= */

function renderQuiz() {

    const quiz = document.getElementById("quiz");

    quiz.innerHTML = "";

    const start = currentPage * questionsPerPage;
    const end = Math.min(start + questionsPerPage, testQuestions.length);

    for(let i = start; i < end; i++) {

        const q = testQuestions[i];

        const div = document.createElement("div");

        div.className = "question";

        let html = "";

        html += `
            <div class="paper-label">
                Question ${i+1} of ${testQuestions.length}
            </div>

            <h3>
                ${i+1}. ${q.q}
            </h3>
        `;

        q.o.forEach((option,index) => {

            const checked = answers[i] === index ? "checked" : "";

            html += `
                <label class="option">
                    <input
                        type="radio"
                        name="question${i}"
                        value="${index}"
                        ${checked}
                        onchange="saveAnswer(${i},${index})"
                    >
                    <b>${optionLetters[index]}.</b>
                    ${option}
                </label>
            `;

        });

        div.innerHTML = html;

        quiz.appendChild(div);
    }

    updateProgress();

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}


/* =========================================================
   SAVE ANSWER
========================================================= */

function saveAnswer(questionIndex, optionIndex) {

    answers[questionIndex] = optionIndex;

    updateProgress();
}


/* =========================================================
   PROGRESS
========================================================= */

function updateProgress() {

    const attempted = answers.filter(a => a !== null).length;

    document.getElementById("attempted").textContent = attempted;

    const percentage =
        (attempted / questions.length) * 100;

    document.getElementById("progressFill").style.width =
        percentage + "%";
}


/* =========================================================
   NAVIGATION
========================================================= */

function nextPage() {

    if((currentPage + 1) * questionsPerPage < testQuestions.length) {

        currentPage++;

        renderQuiz();

    }
    else {

        alert("You are on the last page. Please submit the test.");

    }
}


function previousPage() {

    if(currentPage > 0) {

        currentPage--;

        renderQuiz();

    }
}


/* =========================================================
   SUBMIT TEST
========================================================= */

function submitTest() {

    const unanswered =
        answers.filter(a => a === null).length;

    if(unanswered > 0) {

        const confirmSubmit = confirm(
            "You have " +
            unanswered +
            " unanswered question(s).\n\n" +
            "Do you still want to submit the test?"
        );

        if(!confirmSubmit) {
            return;
        }
    }

    let correct = 0;
    let wrong = 0;

    testQuestions.forEach((q,index) => {

        if(answers[index] === q.a) {

            correct++;

        }
        else if(answers[index] !== null) {

            wrong++;

        }

    });

    const unansweredCount =
        testQuestions.length - correct - wrong;

    const percentage =
        ((correct / testQuestions.length) * 100).toFixed(2);

    const studentName =
        document.getElementById("studentName").value.trim();

    const studentRoll =
        document.getElementById("studentRoll").value.trim();

    let grade = "";

    if(percentage >= 90)
        grade = "Excellent ⭐⭐⭐⭐⭐";
    else if(percentage >= 75)
        grade = "Very Good ⭐⭐⭐⭐";
    else if(percentage >= 60)
        grade = "Good ⭐⭐⭐";
    else if(percentage >= 40)
        grade = "Needs Improvement ⭐⭐";
    else
        grade = "Keep Practising ⭐";

    let html = `

        <h2>TEST RESULT</h2>

        <div class="score">
            ${correct} / ${testQuestions.length}
        </div>

        <p style="text-align:center">
            <b>${percentage}%</b>
        </p>

        <p style="text-align:center">
            <b>${studentName || "Student"}</b>
            ${studentRoll ? " | Roll No: " + studentRoll : ""}
        </p>

        <p style="text-align:center">
            ${grade}
        </p>

        <div class="result-summary">

            <div class="summary-box correct-box">
                Correct<br>
                ${correct}
            </div>

            <div class="summary-box wrong-box">
                Wrong<br>
                ${wrong}
            </div>

            <div class="summary-box unanswered-box">
                Unanswered<br>
                ${unansweredCount}
            </div>

        </div>

        <hr>

        <h2>Answer Review</h2>

    `;


    testQuestions.forEach((q,index) => {

        const studentAnswer = answers[index];

        let className = "";
        let status = "";

        if(studentAnswer === q.a) {

            className = "review-correct";
            status = "✓ Correct";

        }
        else if(studentAnswer === null) {

            className = "review-unanswered";
            status = "⚠ Not Answered";

        }
        else {

            className = "review-wrong";
            status = "✗ Wrong";

        }

        html += `

            <div class="review-item ${className}">

                <b>
                    Q${index+1}. ${q.q}
                </b>

                <p>
                    <b>Status:</b> ${status}
                </p>

        `;

        if(studentAnswer !== null) {

            html += `
                <p class="your-answer">
                    Your Answer:
                    ${optionLetters[studentAnswer]}.
                    ${q.o[studentAnswer]}
                </p>
            `;

        }
        else {

            html += `
                <p class="your-answer">
                    Your Answer: Not Answered
                </p>
            `;

        }

        html += `

                <p class="correct-answer">
                    Correct Answer:
                    ${optionLetters[q.a]}.
                    ${q.o[q.a]}
                </p>

            </div>

        `;

    });


    html += `

        <button class="restart" onclick="restartTest()">
            RETAKE TEST
        </button>

    `;


    const result = document.getElementById("result");

    result.innerHTML = html;

    result.style.display = "block";

    result.scrollIntoView({
        behavior: "smooth"
    });

    /*
       Hide quiz after submission.
    */

    document.getElementById("quiz").style.display = "none";

    document.querySelector(".navigation").style.display = "none";

    document.querySelector(".submit").style.display = "none";

}


/* =========================================================
   RESTART
========================================================= */

function restartTest() {

    location.reload();

}


/* =========================================================
   START
========================================================= */

renderQuiz();

</script>

</body>
</html>
